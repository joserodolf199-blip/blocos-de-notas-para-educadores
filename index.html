<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atlas Digital</title>

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="../css/index.css">
</head>

<body>

  <main class="pagina-login">

    <!-- LOGO -->
    <div class="container-logo">
      <img
        src="../imagens/logo.jpeg"
        alt="Logo do Atlas Digital"
      >
    </div>


    <!-- FORMULÁRIO DE LOGIN -->
    <form
      class="formulario-login"
      id="formulario-login"
    >

      <!-- E-MAIL -->
      <div class="campo-login">

        <label
          class="ocultar-label"
          for="email"
        >
          E-mail
        </label>

        <input
          class="campo-entrada"
          id="email"
          name="email"
          type="email"
          placeholder="E-mail"
          autocomplete="email"
          required
        >

      </div>


      <!-- SENHA -->
      <div class="campo-login">

        <label
          class="ocultar-label"
          for="senha"
        >
          Senha
        </label>

        <input
          class="campo-entrada"
          id="senha"
          name="senha"
          type="password"
          placeholder="Senha"
          autocomplete="current-password"
          required
        >

      </div>


      <!-- BOTÃO LOGIN -->
      <button
        class="botao-entrar"
        type="submit"
      >
        LOGIN
      </button>

    </form>


    <!-- MENSAGEM DE ERRO -->
    <div
      class="mensagem-erro"
      id="mensagem-erro"
      role="alert"
      aria-live="polite"
    ></div>


    <!-- RECUPERAÇÃO DE SENHA -->
    <div class="recuperacao-senha">

      <a href="html/recuperacao.html">
        Esqueceu a senha? Clique aqui para recuperá-la
      </a>

    </div>

  </main>


  <!-- JAVASCRIPT -->
  <script src="js/index.js"></script>

</body>

</html>
