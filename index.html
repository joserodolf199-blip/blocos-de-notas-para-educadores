<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Digital</title>
</head>
<body>
    
    <main class="pagina-login">

        <div class="container-logo">
            <img src="imagens/logo.jpeg" alt="Logo da empresa">
            <!-- Logo aqui -->
        </div>

        <form class="formulario-login">

            <div class="campo-login">
                <!-- Coloquei um class no label para que o css TIRE, pois nós só queremos ele como acessibilidade. @Rodolfo, vai nos ajudando aí -->
                <label class="ocultar-label" for="email">E-mail</label>

                <input 
                    class="campo-entrada" 
                    id="email" 
                    type="email" 
                    placeholder="E-mail" 
                    required
                >
            </div>
            <div class="campo-login">
                <!-- A mesma coisa com esse class -->
                <label class="ocultar-label" for="senha">Senha</label>

                <input 
                    class="campo-entrada" 
                    id="senha" 
                    type="password" 
                    placeholder="Senha" 
                    required
                >
            </div>

            <button class="entrar" type="submit">
                Entrar
            </button>
        </form>

        <div class="divisor-login">
            <hr>
            <p>OU</p>
            <hr>
        </div>

        <div class="login-google">
            <button class="botao-google" type="button">
                Entrar com Google
            </button>
        </div>

        <div class="recuperacao-senha">
            <a href="">Esqueci minha senha</a>
        </div>  
        
    </main>

</body>

</html>
