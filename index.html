<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Digital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <main class="pagina-login">
      <div class="container-logo">
        <img src="imagens/logo.jpeg" alt="Logo da empresa" />
      </div>

      <form class="formulario-login">
        <div class="campo-login">
          <label class="ocultar-label" for="email">E-mail</label>
          <input
            class="campo-entrada"
            id="email"
            type="email"
            placeholder="E-mail"
            required
          />
        </div>

        <div class="campo-login">
          <label class="ocultar-label" for="senha">Senha</label>
          <input
            class="campo-entrada"
            id="senha"
            type="password"
            placeholder="Senha"
            required
          />
        </div>

        <button class="botao-entrar" type="submit">LOGIN</button>
      </form>

      <div class="mensagem-erro" role="alert"></div>

      <div class="divisor-login">
        <hr />
        <p>OU</p>
        <hr />
      </div>

      <div class="login-google">
        <img src="imagens/google.svg" alt="Ícone do Google" class="icone-google" />
        <button class="botao-google" type="button">LOGAR COM GOOGLE</button>
      </div>

      <div class="recuperacao-senha">
        <a href="html/recuperacao.html">Esqueceu a senha? Clique aqui para recuperá-la</a>
      </div>

      <div class="excluir-conta">
        <button class="botao-excluir" type="button">EXCLUIR CONTA</button>
      </div>
    </main>
    <script src="js/index.js"></script>
  </body>
</html>
