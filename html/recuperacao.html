<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atlas Digital - Recuperação de Senha</title>

    <link
        rel="stylesheet"
        href="../css/recuperacao.css"
    >

</head>

<body>

    <main class="pagina-recuperacao">

        <!-- Logo -->

        <div class="container-logo">

            <img
                src="../imagens/logo.jpeg"
                alt="Logo Atlas Digital"
            >

        </div>


        <!-- Formulário -->

        <form class="formulario-recuperacao">


            <!-- Mensagem do sistema -->

            <div
                class="mensagem-recuperacao"
                id="mensagem-recuperacao"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- Etapa 1: E-mail -->

            <div
                class="etapa-recuperacao"
                id="etapa-email"
            >

                <div class="campo-recuperacao">

                    <label
                        class="ocultar-label"
                        for="email"
                    >
                        E-mail
                    </label>

                    <input
                        class="campo-entrada"
                        id="email"
                        type="email"
                        placeholder="E-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    class="botao-recuperar-senha"
                    id="botao-receber-codigo"
                    type="submit"
                >
                    Receber código
                </button>

            </div>


            <!-- Etapa 2: Código -->

            <div
                class="etapa-recuperacao"
                id="etapa-codigo"
                hidden
            >

                <div class="campo-recuperacao">

                    <label
                        class="ocultar-label"
                        for="codigo"
                    >
                        Digite seu código
                    </label>

                    <input
                        class="campo-entrada"
                        id="codigo"
                        type="text"
                        placeholder="Digite seu código"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >

                </div>


                <button
                    class="botao-recuperar-senha"
                    id="botao-enviar-codigo"
                    type="submit"
                >
                    Confirmar código
                </button>

            </div>


            <!-- Etapa 3: Nova senha -->

            <div
                class="etapa-recuperacao"
                id="etapa-nova-senha"
                hidden
            >

                <div class="campo-recuperacao">

                    <label
                        class="ocultar-label"
                        for="nova-senha"
                    >
                        Nova senha
                    </label>

                    <input
                        class="campo-entrada"
                        id="nova-senha"
                        type="password"
                        placeholder="Nova senha"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="campo-recuperacao">

                    <label
                        class="ocultar-label"
                        for="confirmar-nova-senha"
                    >
                        Confirmar nova senha
                    </label>

                    <input
                        class="campo-entrada"
                        id="confirmar-nova-senha"
                        type="password"
                        placeholder="Confirmar nova senha"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    class="botao-recuperar-senha"
                    id="botao-alterar-senha"
                    type="submit"
                >
                    Alterar senha
                </button>

            </div>

        </form>


        <!-- Frase -->

        <div class="frase">

            <p>
                "Cada página lida é um degrau a mais na construção do seu próprio sucesso."
            </p>

        </div>

    </main>


    <script src="../js/recuperacao.js"></script>

</body>

</html>
